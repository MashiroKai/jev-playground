<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1e26; --muted: #6b7280;
    --line: #e3e6ea; --accent: #5e6ad2; --accent-soft: #eceefb;
    --ok: #1a7f4b; --warn: #b45309; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1d2027; --text: #e8eaed; --muted: #9aa1ac;
      --line: #2c3038; --accent: #8b93e8; --accent-soft: #262a3d;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .topline .sub { margin-bottom: 20px; }
  .hdr-actions { display: flex; gap: 8px; flex: none; }
  .hdr-actions button { margin-top: 2px; padding: 6px 12px; font-weight: 400; }
  .keyrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #keyStatus.clickable { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  #keyStatus.clickable:hover { color: var(--accent); }
  #keyEditor input { max-width: 480px; display: block; }
  .confirm { color: var(--ok); font-weight: 600; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea, input[type="text"], input[type="password"], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--text);
    font: inherit;
  }
  textarea { min-height: 96px; resize: vertical; }
  .qrow { display: grid; grid-template-columns: 110px 1fr 170px; gap: 10px; margin-bottom: 10px; }
  .qrow .crit { margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: none; border-radius: 8px; padding: 9px 18px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  button:disabled { opacity: 0.55; cursor: default; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .status { color: var(--muted); }
  .answer { border-top: 1px solid var(--line); padding: 12px 0 2px; }
  .answer:first-child { border-top: none; padding-top: 0; }
  .ahead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .qid { font-weight: 600; }
  .qtype { color: var(--muted); font-size: 12px; }
  .conf { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent-soft); margin: 8px 0; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 4px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); margin: 2px 6px 2px 0; font-variant-numeric: tabular-nums; }
  .value { font-size: 15px; font-weight: 600; }
  .err { color: var(--bad); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  code { background: var(--accent-soft); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <div class="topline">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="hero.sub"></p>
    </div>
    <div class="hdr-actions">
      <button type="button" class="secondary" id="langToggle" data-i18n="lang.toggle" data-i18n-title="lang.toggle.title"></button>
      <button type="button" class="secondary" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel" data-i18n="settings.open" data-i18n-title="settings.title"></button>
    </div>
  </div>

  <section class="panel" id="settingsPanel" hidden>
    <label for="providerSelect" data-i18n="provider.label"></label>
    <select id="providerSelect">
      <option value="official" data-i18n="provider.official"></option>
      <option value="laya" data-i18n="provider.laya"></option>
      <option value="openai-compat" data-i18n="provider.openaiCompat"></option>
    </select>
    <p class="hint" id="providerHint"></p>
    <p class="hint" id="providerReady" role="status"></p>

    <div id="baseUrlRow" style="margin-top:12px">
      <label for="baseUrlInput" data-i18n="provider.baseUrl"></label>
      <input type="text" id="baseUrlInput" data-i18n-placeholder="provider.baseUrl.placeholder" spellcheck="false" autocomplete="off">
      <p class="hint" data-i18n="provider.baseUrl.help"></p>
    </div>

    <div style="margin-top:12px">
      <label for="modelInput" data-i18n="provider.model"></label>
      <input type="text" id="modelInput" data-i18n-placeholder="provider.model.placeholder" spellcheck="false" autocomplete="off">
      <p class="hint" data-i18n="provider.model.help"></p>
    </div>

    <div style="margin-top:12px">
      <label for="keyInput" id="keyLabel" data-i18n="settings.apiKey"></label>
      <div class="keyrow">
        <span id="keyStatus" data-i18n="key.status.checking"></span>
      </div>
      <p class="hint" id="keyHint"></p>
      <div id="keyEditor" hidden>
        <input type="password" id="keyInput" data-i18n-placeholder="key.input.placeholder" data-i18n-aria="aria.newKey" autocomplete="new-password" spellcheck="false">
      </div>
      <p class="hint" data-i18n="provider.key.help"></p>
    </div>

    <div class="actions" style="margin-top:12px">
      <button type="button" id="saveProviderBtn" data-i18n="provider.save"></button>
      <button type="button" class="secondary" id="saveKeyBtn" data-i18n="key.save"></button>
      <span class="status" id="providerMsg" role="status"></span>
    </div>
    <p class="hint" data-i18n="key.save.note"></p>
  </section>

  <section class="panel">
    <label for="state"><span data-i18n="state.label"></span> <span style="font-weight:400;color:var(--muted)" data-i18n="state.hint"></span></label>
    <textarea id="state" data-i18n-placeholder="state.placeholder">Help! My payouts have been failing for 3 days.</textarea>
  </section>

  <section class="panel">
    <label data-i18n="questions.label"></label>
    <div id="questions"></div>
    <div class="actions" style="margin-top:12px">
      <button type="button" class="secondary" id="addBtn" data-i18n="questions.add"></button>
      <button type="button" id="askBtn" data-i18n="ask.idle"></button>
      <span class="status" id="status"></span>
    </div>
  </section>

  <section class="panel" id="resultPanel" hidden>
    <div id="answers"></div>
    <div class="meta" id="respProvider"></div>
    <div class="meta" id="respMeta"></div>
  </section>
</main>

<script type="module">
  import { STRINGS, t, LANGS, LANG_STORAGE_KEY } from "./strings.js";

  // Live language: a stored choice wins, else the browser preference decides.
  function initLang() {
    let stored = null;
    try { stored = localStorage.getItem(LANG_STORAGE_KEY); } catch { stored = null; }
    if (LANGS.includes(stored)) return stored;
    const nav = String(navigator.language || "").toLowerCase();
    return nav.startsWith("zh") ? "zh-CN" : "en";
  }
  let lang = initLang();
  let asking = false;
  let keyNote = null;      // {kind:"plain"|"ok"|"err", key, vars}
  let lastResult = null;       // {kind:"answers", data, ms} | {kind:"error", message}
  let editorOpen = false;      // user revealed the replacement field
  let cfg = null;              // last GET /api/config payload
  let selectedProvider = "official"; // the value in the select (may differ from cfg)

  // Errors carry their key + vars (not a resolved string) so that a language
  // switch re-localizes an already-rendered failure without repeating the call.
  // `suffix` holds backend-supplied detail, which stays verbatim by design.
  function fail(key, vars, suffix) {
    const e = new Error(t(lang, key, vars) + (suffix || ""));
    e.i18n = { key, vars, suffix: suffix || "" };
    return e;
  }
  function errText(e) {
    return e && e.i18n ? t(lang, e.i18n.key, e.i18n.vars) + e.i18n.suffix : String(e && e.message || e);
  }

  // Static copy is declared in the markup and re-filled from the table.
  function applyStatic(root) {
    const scope = root || document;
    for (const el of scope.querySelectorAll("[data-i18n]")) {
      el.textContent = t(lang, el.getAttribute("data-i18n"));
    }
    for (const el of scope.querySelectorAll("[data-i18n-placeholder]")) {
      el.placeholder = t(lang, el.getAttribute("data-i18n-placeholder"));
    }
    for (const el of scope.querySelectorAll("[data-i18n-title]")) {
      el.title = t(lang, el.getAttribute("data-i18n-title"));
    }
    for (const el of scope.querySelectorAll("[data-i18n-aria]")) {
      el.setAttribute("aria-label", t(lang, el.getAttribute("data-i18n-aria")));
    }
  }

  // One question row: type selector + prompt + labels (when the type needs them).
  function addQuestionRow(prefill) {
    const row = document.createElement("div");
    row.className = "qrow";
    row.innerHTML = `
      <select class="qtype" data-i18n-aria="aria.qtype">
        <option value="noul" data-i18n="qtype.noul"></option>
        <option value="choice" data-i18n="qtype.choice"></option>
        <option value="score" data-i18n="qtype.score"></option>
      </select>
      <div>
        <input type="text" class="qinstr" data-i18n-placeholder="q.instr.placeholder" data-i18n-aria="aria.instr">
        <input type="text" class="crit" data-i18n-placeholder="q.crit.placeholder" data-i18n-aria="aria.crit" style="display:none">
        <input type="text" class="critdesc" data-i18n-placeholder="q.critdesc.placeholder" data-i18n-aria="aria.critdesc" style="display:none">
        <div class="hint crit-hint" style="display:none"></div>
      </div>
      <button type="button" class="secondary qdel" data-i18n="q.remove"></button>`;
    const typeSel = row.querySelector(".qtype");
    const crit = row.querySelector(".crit");
    const critdesc = row.querySelector(".critdesc");
    const hint = row.querySelector(".crit-hint");
    function refresh() {
      const show = typeSel.value !== "noul";
      crit.style.display = show ? "" : "none";
      critdesc.style.display = show ? "" : "none";
      hint.style.display = show ? "" : "none";
      refreshRowHint(row);
    }
    typeSel.addEventListener("change", refresh);
    row.querySelector(".qdel").addEventListener("click", () => row.remove());
    if (prefill) {
      typeSel.value = prefill.type;
      row.querySelector(".qinstr").value = prefill.instructions || "";
      if (prefill.criteria) crit.value = prefill.criteria.join(", ");
    }    refresh();
    document.getElementById("questions").appendChild(row);
    applyStatic(row);
  }

  function refreshRowHint(row) {
    row.querySelector(".crit-hint").textContent =
      row.querySelector(".qtype").value === "choice" ? t(lang, "q.hint.choice") : t(lang, "q.hint.score");
  }

  function gatherQuestions() {
    const out = {};
    let n = 0;
    for (const row of document.querySelectorAll(".qrow")) {
      const type = row.querySelector(".qtype").value;
      const instr = row.querySelector(".qinstr").value.trim();
      if (!instr) continue; // skip empty rows
      const labels = row.querySelector(".crit").value
        .split(",").map((s) => s.trim()).filter(Boolean);
      const descs = row.querySelector(".critdesc").value
        .split(",").map((s) => s.trim()).filter(Boolean);
      if ((type === "choice" || type === "score") && labels.length === 0) {
        throw fail("err.criteria.required", { type });
      }
      if (type === "choice" && (labels.length < 2 || labels.length > 255)) {
        throw fail("err.choice.range");
      }
      if (type === "score" && (labels.length < 2 || labels.length > 10)) {
        throw fail("err.score.range");
      }
      // JeV wire shape: choice → object label → description|null;
      // score → ordered array of level labels.
      let criteria;
      if (type === "choice") {
        criteria = {};
        labels.forEach((label, i) => { criteria[label] = descs[i] || null; });
      } else {
        criteria = labels;
      }
      out["q" + (++n)] = type === "noul"
        ? { type, instructions: instr }
        : { type, instructions: instr, criteria };
    }
    return out;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function renderAnswers(answers) {
    const host = document.getElementById("answers");
    host.innerHTML = "";
    for (const [id, a] of Object.entries(answers || {})) {
      const div = document.createElement("div");
      div.className = "answer";
      let valueHtml = "";
      let conf = null;
      let pills = "";
      if (a.type === "noul") {
        conf = typeof a.noul === "number" ? a.noul : null;
        valueHtml = `<span class="value">${a.noul >= 0.5 ? t(lang, "answer.yes") : t(lang, "answer.no")}</span>
          <span class="qtype">${t(lang, "answer.pYes", { p: a.noul })}</span>`;
      } else if (a.type === "choice") {
        conf = a.confidence;
        valueHtml = `<span class="value">${esc(a.choice)}</span>`;
        pills = Object.entries(a.probabilities || {})
          .sort((x, y) => y[1] - x[1])
          .map(([opt, p]) => `<span class="pill">${esc(opt)}: ${p}</span>`)
          .join("");
      } else if (a.type === "score") {
        conf = a.confidence;
        const legend = a.legend || {};
        valueHtml = `<span class="value">${a.score}</span>
          <span class="qtype">${esc(legend[String(Math.round(a.score))] || "")}</span>`;
        pills = Object.entries(a.probabilities || {})
          .sort((x, y) => Number(x[0]) - Number(y[0]))
          .map(([lv, p]) => `<span class="pill">${esc(legend[lv] || lv)}: ${p}</span>`)
          .join("");
      }
      const confHtml = conf === null || conf === undefined
        ? `<span class="qtype">${
            a.confidence_source === "derived"
              ? t(lang, "provider.confidence.derivedMissing")
              : t(lang, "answer.noConfidence")
          }</span>`
        : `<span class="conf">${
            a.confidence_source === "derived"
              ? t(lang, "provider.confidence.derived")
              : t(lang, "answer.confidence", { conf })
          }</span>`;
      div.innerHTML = `
        <div class="ahead"><span class="qid">${esc(id)} <span class="qtype">· ${esc(a.type)}</span></span>${confHtml}</div>
        <div>${valueHtml}</div>
        ${conf === null || conf === undefined ? "" : `<div class="bar"><div style="width:${Math.round(conf * 100)}%"></div></div>`}
        ${pills ? `<div>${pills}</div>` : ""}`;
      host.appendChild(div);
    }
  }

  async function ask() {
    const btn = document.getElementById("askBtn");
    const status = document.getElementById("status");
    const state = document.getElementById("state").value.trim();
    try {
      if (!state) throw fail("err.stateEmpty");
      const questions = gatherQuestions();
      if (Object.keys(questions).length === 0) {
        throw fail("err.noQuestions");
      }
      asking = true;
      btn.disabled = true;
      status.textContent = t(lang, "ask.busy");
      const t0 = performance.now();
      const res = await fetch("/api/evaluate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          state,
          questions,
          // Omitted entirely when it matches the backend's own provider, so a
          // default install keeps sending the historical two-key body.
          ...(cfg && selectedProvider === cfg.provider ? {} : { provider: selectedProvider }),
        }),
      });
      const data = await res.json().catch(() => ({}));
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) {
        if (res.status === 503) {
          openSettings();            // guide to the settings panel
          await refreshConfig();
        }
        lastResult = {
          kind: "error",
          error: fail("err.http",
            { status: res.status, error: data.error || t(lang, "err.http.fallback") },
            data.detail ? " — " + data.detail : ""),
          provider: data.provider || null,
        };
        renderLastResult();
        status.textContent = "";
        return;
      }
      lastResult = { kind: "answers", data, ms };
      renderLastResult();
      status.textContent = "";
    } catch (err) {
      lastResult = { kind: "error", error: err, provider: null };
      renderLastResult();
      status.textContent = "";
    } finally {
      asking = false;
      btn.disabled = false;
    }
  }

  // Repaint the last outcome from its stored data (used when the language changes).
  function renderLastResult() {
    if (!lastResult) return;
    const panel = document.getElementById("resultPanel");
    panel.hidden = false;
    const provLine = document.getElementById("respProvider");
    if (lastResult.kind === "error") {
      document.getElementById("answers").innerHTML =
        `<div class="answer"><span class="err">${esc(t(lang, "err.generic", { msg: errText(lastResult.error) }))}</span></div>`;
      document.getElementById("respMeta").textContent = "";
      provLine.textContent = lastResult.provider
        ? t(lang, "provider.label") + ": " + lastResult.provider
        : "";
      return;
    }
    const { data, ms } = lastResult;
    renderAnswers(data.answers);
    // The provider that actually answered, echoed by the backend (never inferred).
    provLine.textContent = data.provider
      ? t(lang, "provider.label") + ": " + data.provider
      : "";
    document.getElementById("respMeta").textContent = t(lang, "resp.meta", {
      model: data.model || "?",
      in: data.usage?.input_tokens ?? "?",
      out: data.usage?.output_tokens ?? "?",
      ms,
    });
  }

  // --- provider settings (readable config; the key itself stays write-only) ---
  let keyConfigured = false;

  function openSettings() {
    document.getElementById("settingsPanel").hidden = false;
    document.getElementById("settingsBtn").setAttribute("aria-expanded", "true");
  }

  const HINTS = {
    official: "provider.hint.official",
    laya: "provider.hint.laya",
    "openai-compat": "provider.hint.openaiCompat",
  };

  const PROVIDER_LABEL_KEY = {
    official: "provider.official",
    laya: "provider.laya",
    "openai-compat": "provider.openaiCompat",
  };

  // Readiness of *what the form currently holds* — the values the Save button
  // would persist — so a field emptied for editing flips the line at once,
  // instead of the line still describing the already-saved config.
  function renderProviderReady() {
    const el = document.getElementById("providerReady");
    const preset = (cfg && cfg.defaults && cfg.defaults[selectedProvider]) || {};
    const baseUrl = (document.getElementById("baseUrlInput").value || "").trim();
    const model = (document.getElementById("modelInput").value || "").trim();
    // The key slot is global (one key in config.json, shared by every provider),
    // so its presence does not depend on which provider is selected.
    const keyOk = keyConfigured;

    const missingKey = Boolean(preset.keyRequired) && !keyOk;
    const missingShape = Boolean(
      (preset.baseUrlRequired && !baseUrl) || (preset.modelRequired && !model),
    );

    if (!missingKey && !missingShape) {
      el.className = "hint confirm";
      el.textContent = t(lang, "provider.status.ready", {
        provider: t(lang, PROVIDER_LABEL_KEY[selectedProvider] || PROVIDER_LABEL_KEY.official),
        model: model || preset.model || t(lang, "provider.model"),
      });
      return;
    }
    const reason = missingKey && missingShape
      ? `${t(lang, "provider.status.needKey")} · ${t(lang, "provider.status.needModelBase")}`
      : missingKey
        ? t(lang, "provider.status.needKey")
        : t(lang, "provider.status.needModelBase");
    el.className = "hint";
    el.textContent = t(lang, "provider.status.notReady", { reason });
  }

  function renderProviderStatus() {
    const status = document.getElementById("keyStatus");
    const hint = document.getElementById("keyHint");
    status.classList.toggle("clickable", keyConfigured);
    if (keyConfigured) {
      status.textContent = t(lang, "key.status.configured");
      hint.textContent = t(lang, "key.hint.configured");
      document.getElementById("keyEditor").hidden = !editorOpen;
    } else {
      status.textContent = t(lang, "key.status.missing");
      hint.textContent = t(lang, "key.hint.missing");
      document.getElementById("keyEditor").hidden = false;
    }
    document.getElementById("providerHint").textContent =
      t(lang, HINTS[selectedProvider] || HINTS.official);
    // The key is mandatory for the hosted provider and optional for the local /
    // self-hosted ones, so the label follows the selection rather than claiming
    // "optional" in every case.
    const keyRequired = Boolean(cfg && cfg.defaults && cfg.defaults[selectedProvider]?.keyRequired);
    document.getElementById("keyLabel").textContent =
      keyRequired ? t(lang, "settings.apiKey") : t(lang, "provider.key");
    // The base-URL field is meaningless for the hosted provider (fixed endpoint);
    // LAYA and OpenAI-compatible endpoints are both self-hosted, so it is shown.
    document.getElementById("baseUrlRow").hidden = selectedProvider === "official";
    renderProviderReady();
  }

  // Fill the form from the backend's config without clobbering what the user is
  // typing: values are only overwritten when the field is not focused.
  function applyConfig(data, { force } = {}) {
    cfg = data;
    selectedProvider = data.provider;
    document.getElementById("providerSelect").value = data.provider;
    const baseInput = document.getElementById("baseUrlInput");
    const modelInput = document.getElementById("modelInput");
    if (force || document.activeElement !== baseInput) baseInput.value = data.baseUrl || "";
    if (force || document.activeElement !== modelInput) modelInput.value = data.model || "";
    keyConfigured = data.keyConfigured === true;
    renderProviderStatus();
  }

  async function refreshConfig(opts) {
    try {
      const res = await fetch("/api/config");
      // Contract: this endpoint always answers 200, even on a fresh install.
      const data = await res.json();
      applyConfig(data, opts);
    } catch {
      /* the panel simply keeps its last known state */
    }
  }

  function renderKeyNote() {
    const msg = document.getElementById("providerMsg");
    if (!keyNote) { msg.textContent = ""; return; }
    const text = t(lang, keyNote.key, keyNote.vars);
    if (keyNote.kind === "plain") msg.textContent = text;
    else msg.innerHTML = `<span class="${keyNote.kind === "ok" ? "confirm" : "err"}">${esc(text)}</span>`;
  }

  function fillProviderDefaults(next) {
    // Switching provider shows that provider's defaults rather than the previous
    // provider's values (the backend applies the same rule when saving). The
    // defaults come from the backend so the page hardcodes none of them.
    const d = (cfg && cfg.defaults && cfg.defaults[next]) || { baseUrl: "", model: "" };
    document.getElementById("baseUrlInput").value = d.baseUrl || "";
    document.getElementById("modelInput").value = d.model || "";
  }

  document.getElementById("providerSelect").addEventListener("change", (e) => {
    selectedProvider = e.target.value;
    fillProviderDefaults(selectedProvider);
    renderProviderStatus();
    keyNote = null;
    renderKeyNote();
  });

  document.getElementById("keyStatus").addEventListener("click", () => {
    if (!keyConfigured) return; // the field is already open when nothing is stored
    editorOpen = !editorOpen;
    document.getElementById("keyEditor").hidden = !editorOpen;
    if (editorOpen) document.getElementById("keyInput").focus();
  });

  // Typing an endpoint/model flips the readiness line immediately, so the
  // missing-field state of an unsaved selection is visible before Save.
  document.getElementById("baseUrlInput").addEventListener("input", renderProviderReady);
  document.getElementById("modelInput").addEventListener("input", renderProviderReady);

  async function saveProvider() {
    const btn = document.getElementById("saveProviderBtn");
    const data = {
      provider: selectedProvider,
      baseUrl: document.getElementById("baseUrlInput").value.trim(),
      model: document.getElementById("modelInput").value.trim(),
    };
    btn.disabled = true;
    keyNote = { kind: "plain", key: "key.saving" };
    renderKeyNote();
    try {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      await refreshConfig({ force: true });
      keyNote = {
        kind: "ok",
        key: "provider.saved",
        vars: { provider: body.provider, model: body.model },
      };
      renderKeyNote();
    } catch (err) {
      keyNote = { kind: "err", key: "provider.save.failed", vars: { msg: err.message } };
      renderKeyNote();
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById("saveProviderBtn").addEventListener("click", saveProvider);

  async function saveKey() {
    const input = document.getElementById("keyInput");
    const btn = document.getElementById("saveKeyBtn");
    const value = input.value;
    if (!value.trim()) {
      keyNote = { kind: "err", key: "key.err.empty" };
      renderKeyNote();
      return;
    }
    btn.disabled = true;
    keyNote = { kind: "plain", key: "key.saving" };
    renderKeyNote();
    try {
      const res = await fetch("/api/config/api-key", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey: value }), // sent once, never kept in the page
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      input.value = ""; // clear immediately — the page never retains the secret
      keyConfigured = true;
      editorOpen = false;
      renderProviderStatus();
      keyNote = { kind: "ok", key: "key.saved", vars: { len: data.length, fp: data.fingerprint } };
      renderKeyNote();
    } catch (err) {
      keyNote = { kind: "err", key: "key.save.failed", vars: { msg: err.message } }; // input kept for retry
      renderKeyNote();
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById("saveKeyBtn").addEventListener("click", saveKey);
  document.getElementById("keyInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveKey();
  });
  document.getElementById("settingsBtn").addEventListener("click", () => {
    const panel = document.getElementById("settingsPanel");
    panel.hidden = !panel.hidden;
    document.getElementById("settingsBtn").setAttribute("aria-expanded", String(!panel.hidden));
    if (!panel.hidden) refreshConfig();
  });

  // --- language switch ------------------------------------------------------
  function renderAll() {
    document.documentElement.lang = lang;
    applyStatic();
    for (const row of document.querySelectorAll(".qrow")) refreshRowHint(row);
    if (cfg) renderProviderStatus();
    renderKeyNote();
    renderLastResult();
    if (asking) document.getElementById("status").textContent = t(lang, "ask.busy");
  }

  function setLang(next) {
    if (!LANGS.includes(next)) return;
    lang = next;
    try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch { /* storage blocked */ }
    renderAll();
  }

  document.getElementById("langToggle").addEventListener("click", () => {
    setLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]);
  });

  document.getElementById("addBtn").addEventListener("click", () => addQuestionRow());
  document.getElementById("askBtn").addEventListener("click", ask);
  addQuestionRow({ type: "noul", instructions: "Does this convey urgency?" });
  addQuestionRow({ type: "score", instructions: "How frustrated is this customer?", criteria: ["calm", "frustrated", "very angry"] });
  await refreshConfig({ force: true });
  renderAll();
</script>
</body>
</html>
